[package]
name = "truehalo"
version = "0.2.3"
description = "Native, privacy-first AI screen overlay for desktop"
authors = ["TrueHalo contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Neksand/TrueHalo"
homepage = "https://github.com/Neksand/TrueHalo#readme"

[lib]
name = "truehalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
window-vibrancy = "0.8"
open = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
